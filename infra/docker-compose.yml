name: reno

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reno
      POSTGRES_PASSWORD: reno
      POSTGRES_DB: reno
    ports: ["5433:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reno"]
      interval: 3s
      retries: 20

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reno
      POSTGRES_PASSWORD: reno
      POSTGRES_DB: reno_test
    ports: ["5434:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reno"]
      interval: 3s
      retries: 20

volumes:
  dbdata:

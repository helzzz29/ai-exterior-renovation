[project]
name = "renovation-api"
version = "0.1.0"
description = "Exterior house renovation planning and cost estimation API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "procrastinate>=2.0",
    "psycopg[binary,pool]>=3.2",
    "structlog>=24.1",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "shapely>=2.0",
    "reportlab>=4.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "tenacity>=9.0",
    "httpx>=0.27",
    "google-genai>=1.0",
    "typesafe-sdk[http2,pil]",
    "boto3>=1.43.118",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pypdf>=5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls real Gemini/Jev APIs (needs keys and RUN_LIVE=1)",
    "db: needs the test Postgres database",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.coverage.run]
# SQLAlchemy asyncio runs code in greenlets; without this, lines after DB calls are not traced
concurrency = ["greenlet", "thread"]
omit = ["app/migrations/versions/*"]

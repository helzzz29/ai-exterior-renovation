# Render Blueprint: one free web service built from the Dockerfile.
# Secrets are marked `sync: false`: Render asks for them once when the Blueprint is created.
services:
  - type: web
    name: renovation-planner
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # Neon, direct (not "pooled") connection string
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JEV_API_KEY
        sync: false
      - key: SEED_USERS # {"email": "argon2 hash", ...} from scripts/provision_users.py
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL # e.g. https://s3.eu-central-003.backblazeb2.com
        sync: false
      - key: S3_REGION # e.g. eu-central-003
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SIGNUP_OPEN
        value: "false"
      - key: DAILY_PHOTO_LIMIT
        value: "10"
      - key: DAILY_NEW_LOOK_LIMIT
        value: "15"
      # 512 MB of memory on the free plan: keep parallel work small
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: GEMINI_MAX_CONCURRENCY
        value: "2"
      - key: JEV_MAX_CONCURRENCY
        value: "4"
